<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>모두의 준비물 — 포스트 관리</title>
  <!--
    모두의 준비물 Staff 대시보드 (2026-10-16 신설)
    · 단일 HTML, 빌드 없음. 라이브러리 = supabase-js(CDN)만.
    · 앱 관리자 화면(src/components/admin/PostForm.tsx · TourApiPicker.tsx · PhotoSearchSheet.tsx,
      src/api/admin-posts.ts · locations.ts · photoSearch.ts)과 1:1 동일 저장 규칙.
      - 장소 = 10-08 D안 (연결 + 한줄 설명만, TourAPI 값 덮어쓰기 없음)      docs/25 §9
      - 이미지 = 출처 칩·공공누리 유형·credit 자동 생성, 저장 후 Storage 정리  docs/18 §7·§7-A·§9
      - 본문 마크업 = ## · ** · __ · =y= =b= =r= =g=                           docs/19
    · 보안: Supabase URL·anon 키는 설정 화면에서 운영자가 직접 입력 → 이 브라우저(localStorage)에만 저장.
      service_role 키 입력 칸 없음. 로그인 = 카카오(앱과 동일 Supabase OAuth, implicit).
      외부 문자열(TourAPI·사진 API·본문)은 textContent로만 그림 (innerHTML 금지).
    · 배포: lifepack.kr 웹 repo → /admin/index.html. Supabase Redirect URLs에 https://lifepack.kr/admin/ 등록.
  -->
  <style>
    @font-face { font-family: 'Pretendard'; font-weight: 400; font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Pretendard'; font-weight: 500; font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2') format('woff2'); }
    @font-face { font-family: 'Pretendard'; font-weight: 600; font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2'); }
    @font-face { font-family: 'Pretendard'; font-weight: 700; font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2'); }

    :root {
      --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1F1B16; --ink-soft: #6B645B; --ink-faint: #A89F92;
      --line: #EBE5DB; --brand: #60A4CE; --brand-soft: #E8F1F8; --warn: #E74C3C; --kakao: #FEE500;
      --cta: #414141; --low: #F5F5F5; --band: #F1F3F4; --border: #E0E3E7;
      --purple: #907CFF; --green: #8DC970;
      --side-w: 220px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
    button, input, textarea, select { font-family: inherit; font-size: 14px; color: var(--ink); }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    a { color: var(--brand); }
    .hidden { display: none !important; }
    .muted { color: var(--ink-soft); }
    .caption { color: var(--ink-faint); font-size: 12px; }
    .warnText { color: var(--warn); }

    /* ── 공통 입력 ─────────────────────────── */
    .input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; background: var(--surface); outline: none; }
    .input:focus, textarea.input:focus { border-color: var(--cta); }
    textarea.input { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.6; }
    .label { font-weight: 600; font-size: 12px; color: var(--ink-soft); letter-spacing: .2px; display: flex; justify-content: space-between; align-items: center; }
    .helper { font-size: 11px; color: var(--ink-faint); }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink-soft); }
    .chip.on { background: var(--cta); border-color: var(--cta); color: #fff; }
    .chip.sm { height: 26px; padding: 0 9px; font-size: 11px; }
    .btn { height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--cta); background: var(--surface); color: var(--cta); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn.primary { background: var(--cta); color: #fff; }
    .btn.pill { border-radius: 999px; }
    .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
    .btn.ghost { border-color: transparent; }
    .btn.danger { border-color: transparent; color: var(--warn); }
    .btn.kakao { background: var(--kakao); border-color: var(--kakao); color: #191919; height: 52px; font-size: 15px; width: 100%; max-width: 360px; }
    .iconBtn { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink); }
    .iconBtn:hover { background: var(--low); }
    .iconBtn.del { color: var(--warn); }
    .row { display: flex; gap: 8px; align-items: center; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }

    /* ── 레이아웃 ─────────────────────────── */
    #app { display: flex; min-height: 100vh; }
    aside.side { width: var(--side-w); flex: 0 0 var(--side-w); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 6px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 16px; font-weight: 600; font-size: 16px; }
    .brand .logo { width: 24px; height: 24px; border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
    .brand .logo i { display: block; }
    .menu { display: flex; flex-direction: column; gap: 2px; }
    .menu button { text-align: left; height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; font-size: 14px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
    .menu button.on { background: var(--brand-soft); color: var(--ink); font-weight: 600; }
    .menu button:hover:not(.on) { background: var(--low); }
    .menu .sub { font-size: 11px; color: var(--ink-faint); padding: 14px 12px 4px; }
    .sideFoot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--ink-soft); }
    .sideFoot .who { display: flex; align-items: center; gap: 8px; }
    .sideFoot .who img, .sideFoot .who .av { width: 28px; height: 28px; border-radius: 50%; background: var(--low); object-fit: cover; }
    main.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { height: 52px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 12px; position: sticky; top: 0; background: var(--surface); z-index: 5; }
    .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .hamb { display: none; }
    .content { padding: 20px; flex: 1; }

    /* ── 로그인·설정·차단 ─────────────────── */
    .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
    .panel h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .panel p { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .keyRow { display: flex; gap: 6px; }
    .keyRow .input { flex: 1; }

    /* ── 목록 ─────────────────────────────── */
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .toolbar .input { width: 240px; }
    .toolbar select.input { width: 130px; }
    table.list { width: 100%; border-collapse: collapse; }
    table.list th { text-align: left; font-size: 12px; color: var(--ink-faint); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    table.list td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.list tr.rowBtn { cursor: pointer; }
    table.list tr.rowBtn:hover td { background: var(--low); }
    .thumb { width: 56px; height: 40px; border-radius: 6px; background: var(--band); object-fit: contain; display: block; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--low); font-size: 11px; font-weight: 500; }
    .tdTitle { font-weight: 600; }
    .empty { padding: 60px 0; text-align: center; color: var(--ink-faint); }

    /* ── 편집 + 미리보기 ───────────────────── */
    .editorWrap { display: flex; gap: 20px; align-items: flex-start; }
    .form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; max-width: 760px; }
    .previewCol { width: 395px; flex: 0 0 395px; position: sticky; top: 72px; }
    .previewCol.collapsed { width: 44px; flex-basis: 44px; }
    .previewCol.collapsed .phone { display: none; }
    .previewHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--ink-soft); }
    .phone { width: 375px; height: calc(100vh - 130px); min-height: 520px; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(31,27,22,.04), 0 8px 24px rgba(31,27,22,.06); }
    .phone .screen { height: 100%; overflow-y: auto; }
    .viewTabs { display: none; gap: 6px; margin-bottom: 12px; }
    .viewTabs button { flex: 1; }

    .mdToolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .mdBtn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
    .mdBtn.hl { width: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .mdBtn.hl i { width: 14px; height: 14px; border-radius: 50%; display: block; }
    textarea.body { min-height: 320px; font-size: 15px; }

    .imgCard .thumbWrap { width: 56px; height: 56px; border-radius: 6px; background: var(--band); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 56px; }
    .imgCard .thumbWrap img { max-width: 100%; max-height: 100%; }
    .idx { width: 18px; font-size: 11px; color: var(--ink-faint); text-align: center; }
    .grow { flex: 1; min-width: 0; }
    .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .small { font-size: 12px; }
    .srcInput { height: 36px; font-size: 12px; }
    .dropZone { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--ink-faint); font-size: 12px; }
    .dropZone.over { border-color: var(--cta); color: var(--ink); background: var(--low); }

    /* ── 모달 ─────────────────────────────── */
    .modalBack { position: fixed; inset: 0; background: rgba(31,27,22,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal { width: 100%; max-width: 960px; max-height: 92vh; background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
    .modal.sm { max-width: 420px; }
    .modalHead { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
    .modalBody { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .modalFoot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
    .modalFoot .count { color: var(--ink-soft); font-size: 13px; }
    .modalFoot .count b { color: var(--cta); }
    .modalFoot .btn { flex: 1; }
    .stepper { height: 40px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; }
    .stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 16px; }
    .stepper span { flex: 1; text-align: center; font-weight: 600; }
    .resultCard { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
    .resultCard.on { border-color: var(--cta); background: var(--low); }
    .resultCard img, .resultCard .noimg { width: 64px; height: 64px; border-radius: 8px; background: var(--low); object-fit: cover; flex: 0 0 64px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--ink-faint); }
    .checkbox { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; flex: 0 0 24px; }
    .checkbox.on { background: var(--cta); border-color: var(--cta); }
    .outline { border: 1px solid var(--line); background: var(--surface); }
    .grid3 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; } /* 2026-10-16 문지영: 3열 → 4열 → 5열 (타일 약 178px, 장수는 구역당 30 유지). 폰 폭은 아래 2열 그대로 */
    .tile { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-soft); }
    .tile .pic { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--band); cursor: zoom-in; border: 2px solid transparent; }
    .tile .pic.on { border-color: var(--cta); }
    .tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .pick { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.25); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .tile .pick.on { background: var(--cta); border-color: var(--cta); }
    .tile.dim .pic { opacity: .45; }
    .tile .added { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; background: rgba(0,0,0,.35); }
    .secHead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
    .secHead b { font-size: 14px; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
    .lightbox img { max-width: 96vw; max-height: 96vh; object-fit: contain; }
    /* 2026-10-16 문지영: 크게 보기 아래 정보 줄 (구역 · 제목 · 장소 · 작가 · 촬영시기 · 수상 · 공공누리) */
    .lightbox.withInfo { flex-direction: column; gap: 10px; }
    .lightbox.withInfo img { max-height: calc(96vh - 48px); }
    .lightbox .info { color: #fff; font-size: 13px; line-height: 1.5; text-align: center; max-width: 96vw; padding: 0 16px; opacity: .92; }
    .lightbox .info b { font-weight: 600; }
    .tile .tt { font-weight: 600; color: var(--ink); }

    /* ── 토스트 ───────────────────────────── */
    #toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 70; }
    .toast { background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 90vw; }
    .toast.err { background: var(--warn); }
    .spin { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.15); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 미리보기(앱 상세 재현) ───────────── */
    .pv { font-family: 'Pretendard', system-ui, sans-serif; color: #1F1B16; background: #fff; padding-bottom: 40px; }
    .pv .hdr { height: 52px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #343434; border-bottom: 1px solid #F1F3F4; }
    .pv .ptb { padding: 10px 16px 8px; text-align: center; }
    .pv .ptb .sub { font-size: 11px; font-weight: 600; color: #60A4CE; letter-spacing: .4px; margin-bottom: 6px; }
    .pv .ptb .title { font-size: 24px; font-weight: 600; line-height: 32px; letter-spacing: -.6px; }
    .pv .pab { display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
    .pv .pab .av { width: 36px; height: 36px; border-radius: 50%; background: #E8F1F8; color: #60A4CE; display: flex; align-items: center; justify-content: center; font-weight: 700; object-fit: cover; }
    .pv .pab .nm { font-size: 14px; font-weight: 600; }
    .pv .pab .nm span { font-size: 11px; color: #60A4CE; margin-left: 6px; }
    .pv .pab .mt { font-size: 11px; color: #A89F92; }
    .pv .pst { padding: 18px 16px 10px; font-size: 17px; line-height: 25px; color: #4A4A4A; letter-spacing: -.2px; white-space: pre-wrap; }
    .pv .slider { position: relative; background: #F1F3F4; height: 250px; overflow: hidden; }
    .pv .slider img { width: 100%; height: 100%; display: block; }
    .pv .slider img.cover { object-fit: cover; }
    .pv .slider img.contain { object-fit: contain; }
    .pv .slider .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); font-size: 16px; }
    .pv .slider .nav.l { left: 8px; } .pv .slider .nav.r { right: 8px; }
    .pv .slider .badge { position: absolute; right: 12px; bottom: 10px; background: rgba(0,0,0,.45); color: #fff; font-size: 12px; letter-spacing: 1px; padding: 2px 8px; border-radius: 999px; }
    .pv .slider .fallback { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 800; color: #60A4CE; opacity: .2; }
    .pv .credit { background: #F1F3F4; text-align: center; font-size: 12px; color: #A89F92; padding: 5px 16px 2px; }
    .pv .credit.last { border-radius: 0 0 20px 20px; padding-bottom: 8px; }
    .pv .band { background: #F1F3F4; border-radius: 0 0 10px 10px; padding: 6px 16px 10px; display: flex; align-items: center; gap: 8px; }
    .pv .band .lbl { font-size: 12px; color: #6B645B; white-space: nowrap; }
    .pv .band .dots { display: flex; gap: 3px; flex: 1; justify-content: flex-end; }
    .pv .band .dots i { width: 20px; height: 20px; border-radius: 50%; background: #E0E3E7; color: #8A8A8A; font-size: 10px; display: flex; align-items: center; justify-content: center; font-style: normal; }
    .pv .band .dots i.best { background: #8DC970; color: #fff; font-weight: 600; }
    .pv .pc { padding: 24px 20px 10px; }
    .pv .pc p { margin: 0; font-size: 17px; line-height: 25px; color: #4A4A4A; letter-spacing: -.2px; word-break: keep-all; }
    .pv .pc .gap { height: 16px; }
    .pv .pc h2 { margin: 14px 0 6px; font-size: 19px; line-height: 24px; color: #4A4A4A; letter-spacing: -.6px; font-weight: 700; }
    .pv .pc b { font-weight: 600; }
    .pv .pc u { font-weight: 500; }
    .pv .pc mark { color: #1F1B16; font-weight: 500; padding: 0; }
    .pv .pc mark.y { background: #FEF8DB; } .pv .pc mark.b { background: #E5F1F8; } .pv .pc mark.r { background: #FFEEEB; } .pv .pc mark.g { background: #ECF6E5; }
    .pv .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 24px; }
    .pv .tags span { padding: 5px 10px 5px 12px; border: 1px solid #E0E3E7; border-radius: 999px; font-size: 13px; color: #7E7E7E; }
    .pv .prc { background: #F1F3F4; padding: 30px 16px 18px; }
    .pv .prc .t { font-size: 18px; font-weight: 600; color: #343434; letter-spacing: -.3px; margin-bottom: 10px; display: flex; gap: 6px; align-items: center; }
    .pv .prc .sorts { display: flex; gap: 6px; margin-bottom: 4px; }
    .pv .prc .sorts span { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: #fff; color: #6B645B; border: 1px solid #E0E3E7; }
    .pv .prc .sorts span.on { background: #414141; color: #fff; border-color: #414141; }
    .pv .prc .grid { display: flex; flex-wrap: wrap; justify-content: space-between; }
    .pv .prc .gi { width: 48.5%; padding: 12px 0; }
    .pv .prc .gi .im { width: 100%; aspect-ratio: 5/4; background: #E8EAED; border-radius: 4px; margin-bottom: 10px; object-fit: cover; display: block; }
    .pv .prc .wide { padding: 12px 0; }
    .pv .prc .wide .im { width: 100%; height: 160px; background: #E8EAED; border-radius: 4px; margin-bottom: 10px; object-fit: cover; display: block; }
    .pv .prc .wide .per { position: absolute; top: 12px; left: 12px; background: #fff; border-radius: 4px; padding: 4px 8px; font-size: 12px; font-weight: 600; color: #4A4A4A; }

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);

    else if (k in node && typeof v !== 'string') node[k] = v;
    else node.setAttribute(k, String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }

}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

}
function withTimeout(promise, ms, label) {
  return new Promise((resolve, reject) => {

    Promise.resolve(promise).then(v => { clearTimeout(timer); resolve(v); }, e => { clearTimeout(timer); reject(e); });
  });
}

function touchActive() { try { localStorage.setItem(LAST_ACTIVE_KEY, String(Date.now())); } catch {} }
function expiredByInactivity() {
  const days = state.cfg?.autoLogoutDays ?? 7;
  if (!days) return false;

}

/* ═══════════════════════════════════════════════════════════════
   7. 저장 규칙 — src/api/admin-posts.ts · src/api/locations.ts 이식
   ═══════════════════════════════════════════════════════════════ */
function buildImageCredit(source, photographer) {
  const name = (photographer || '').trim();
  switch (source) {
    case 'unsplash_free': return name ? 'Photo by ' + name + ' on Unsplash' : 'Unsplash';
    case 'tour_api': { const person = name.replace(/^한국관광공사\s*/, ''); return person ? 'ⓒ한국관광공사 · ' + person : 'ⓒ한국관광공사'; }
    case 'own_photo': return name ? 'ⓒ모두의 준비물 · ' + name : 'ⓒ모두의 준비물';
    default: return null;
  }
}
function resolveCredit(img) { return img.sourceType ? buildImageCredit(img.sourceType, img.photographer) : img.legacyCredit; }
function licenseLabel(l) { const hit = POST_IMAGE_LICENSES.find(x => x.value === l); return hit ? '공공누리 ' + hit.label : '유형 미확인'; }
function deriveThumbUrl(u) { if (!u) return ''; if (u.includes('/thumb/')) return u; if (u.includes('/post-images/')) return u.replace(/\/([^/]+)$/, '/thumb/$1'); return u; }
function getPostOriginalImageUrl(t) { if (!t) return null; return t.includes('/thumb/') ? t.replace('/thumb/', '/') : t; }
function sanitizeSeoSlug(s) { return s.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }
function photoKey(origin, id) { return origin + ':' + id; }

function validate(input) {
  if (!input.title.trim()) return '제목을 입력해주세요';
  if (input.title.length > 50) return '제목은 50자 이내로 입력해주세요';
  if (input.content && input.content.length > 50000) return '본문은 5만자 이내로 입력해주세요';
  if (input.month !== null && (input.month < 1 || input.month > 12)) return '월은 1~12 사이여야 해요';
  if (input.subtitle && input.subtitle.length > 300) return '서브타이틀은 300자 이내로 입력해주세요';
  return null;
}

/* TourAPI 날짜 변환 */
function tourapiDateToISO(s) { return (s && s.length === 8) ? s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8) : null; }
function isoToTourapiDate(iso) { return iso ? iso.slice(0, 10).replace(/-/g, '') : undefined; }
function areaCodeToSido(code) { if (!code) return null; return AREA_CODES.find(a => a.code === code)?.name ?? null; }
function safeFloat(s) { if (!s) return null; const n = parseFloat(s); return Number.isFinite(n) ? n : null; }

/* 10-08 D안: 수정 화면 연결 장소 = 실제 행 */
const LINKED_ITEM_COLUMNS = 'id, tourapi_id, content_type_id, name, address1, address2, thumbnail_url, thumbnail_url_2, lat, lng, area_code, sigungu_code, event_start, event_end, tel, description, staff_note';
async function fetchLinkedLocationItems(ids) {
  if (!ids.length) return [];
  const { data, error } = await sb.from('tourapi_locations').select(LINKED_ITEM_COLUMNS).in('id', ids);
  if (error) throw error;
  const byId = new Map((data || []).map(l => [l.id, l]));
  return ids.map(id => byId.get(id)).filter(Boolean).map(l => ({
    locationId: l.id, contentId: l.tourapi_id, contentTypeId: l.content_type_id || '', title: l.name,
    addr1: l.address1 || undefined, addr2: l.address2 || undefined,
    firstImage: l.thumbnail_url || undefined, firstImage2: l.thumbnail_url_2 || undefined,
    mapX: l.lng != null ? String(l.lng) : undefined, mapY: l.lat != null ? String(l.lat) : undefined,
    areaCode: l.area_code || undefined, sigunguCode: l.sigungu_code || undefined,
    eventStartDate: isoToTourapiDate(l.event_start), eventEndDate: isoToTourapiDate(l.event_end),
    tel: l.tel || undefined, description: l.description || undefined, note: l.staff_note || undefined,
  }));
}

/* 10-08 D안 upsert: 새 장소만 INSERT · 한줄 설명만 UPDATE */
async function upsertLocations(items) {
  if (!items.length) return [];
  const idByTourapiId = new Map();
  const freshIds = items.filter(i => !i.locationId).map(i => i.contentId);
  if (freshIds.length) {
    const { data, error } = await sb.from('tourapi_locations').select('id, tourapi_id').in('tourapi_id', freshIds);
    if (error) throw error;
    (data || []).forEach(r => idByTourapiId.set(r.tourapi_id, r.id));
  }
  const toInsert = items.filter(i => !i.locationId && !idByTourapiId.has(i.contentId));
  const rows = toInsert.map(item => {
    const row = {
      tourapi_id: item.contentId, content_type_id: item.contentTypeId || null, name: item.title,
      thumbnail_url: item.firstImage || null, thumbnail_url_2: item.firstImage2 || null,
      sido: areaCodeToSido(item.areaCode), sigungu: null,
      area_code: item.areaCode || null, sigungu_code: item.sigunguCode || null,
      address1: item.addr1 || null, address2: item.addr2 || null,
      lat: safeFloat(item.mapY), lng: safeFloat(item.mapX),
      event_start: tourapiDateToISO(item.eventStartDate), event_end: tourapiDateToISO(item.eventEndDate),
      tel: item.tel || null, staff_note: item.note || null, raw_data: item, cached_at: new Date().toISOString(),
    };
    if (item.description && item.description.trim()) row.description = item.description.trim();
    return row;
  });
  if (rows.length) {
    const { data, error } = await sb.from('tourapi_locations').insert(rows).select('id, tourapi_id');
    if (error) throw error;
    (data || []).forEach(r => idByTourapiId.set(r.tourapi_id, r.id));
  }
  const ids = items.map(i => i.locationId || idByTourapiId.get(i.contentId)).filter(Boolean);
  const { data, error } = await sb.from('tourapi_locations').select('*').in('id', ids);
  if (error) throw error;
  const byId = new Map((data || []).map(r => [r.id, r]));
  const descUpdates = items
    .map(i => ({ id: i.locationId || idByTourapiId.get(i.contentId), desc: (i.description || '').trim() }))
    .filter(u => u.id && u.desc && byId.get(u.id)?.description !== u.desc);
  const results = await Promise.all(descUpdates.map(u => sb.from('tourapi_locations').update({ description: u.desc }).eq('id', u.id)));
  const descError = results.find(r => r.error)?.error;
  if (descError) throw descError;
  descUpdates.forEach(u => { const row = byId.get(u.id); if (row) row.description = u.desc; });
  return ids.map(id => byId.get(id)).filter(Boolean);
}

async function buildPayload(input, userId) {
  let relatedLocationIds = [];
  const suggested = {};
  if (input.tourapi_items && input.tourapi_items.length) {
    const locations = await upsertLocations(input.tourapi_items);
    relatedLocationIds = locations.map(l => l.id);
    suggested.tourapi_items = input.tourapi_items.map((it, idx) => ({ ...it, order: idx }));   // v1.0 backward compat
  }
  if (input.packlist && ((input.packlist.title || '').trim() || (input.packlist.groups || []).length)) {
    suggested.packlist = {
      title: (input.packlist.title || '').trim(),
      groups: (input.packlist.groups || []).map(g => ({ label: (g.label || '').trim(), items: (g.items || []).map(i => i.trim()).filter(Boolean) })).filter(g => g.label || g.items.length),
    };
  }
  return {
    author_id: userId,
    title: input.title.trim(),
    subtitle: (input.subtitle || '').trim() || null,
    category: input.category || null,
    month: input.month ?? null,
    best_months: input.best_months && input.best_months.length ? input.best_months : null,
    thumbnail_url: (input.thumbnail_url || '').trim() || null,
    images: input.images || [],
    content: input.content || null,
    tags: input.tags || [],
    subsection_title: (input.subsection_title || '').trim() || null,
    location_group_title: (input.location_group_title || '').trim() || null,
    attraction_group_title: (input.attraction_group_title || '').trim() || null,
    related_location_ids: relatedLocationIds,
    suggested_items: Object.keys(suggested).length ? suggested : null,
  };
}
// 2026-10-20 초안/발행 — publish=false면 published_at NULL(초안, 사용자에겐 안 보임). 앱 폼은 즉시 발행(DEFAULT NOW()) 그대로.
async function createPost(input, userId, publish) {
  const v = validate(input); if (v) return { error: v };
  try {
    const payload = await buildPayload(input, userId);
    payload.published_at = publish ? new Date().toISOString() : null;
    const { data, error } = await sb.from('posts').insert(payload).select('id').single();
    if (error) return { error: error.message };
    if (!data?.id) return { error: '글 ID를 받지 못했어요' };
    return { data: { id: data.id } };
  } catch (e) { return { error: e?.message || '저장 중 오류가 발생했어요' }; }
}
// pubMode: 'keep'(발행 상태 유지) | 'draft'(초안 유지) | 'publish'(초안 → 발행: 문지영 10-20 결정 — 작성일도 발행 시각으로)
async function updatePost(id, input, userId, pubMode) {
  const v = validate(input); if (v) return { error: v };
  try {
    const payload = await buildPayload(input, userId);
    if (pubMode === 'publish') { const now = new Date().toISOString(); payload.published_at = now; payload.created_at = now; }
    else if (pubMode === 'draft') payload.published_at = null;
    const { error } = await sb.from('posts').update(payload).eq('id', id).is('deleted_at', null);
    if (error) return { error: error.message };
    return {};
  } catch (e) { return { error: e?.message || '저장 중 오류가 발생했어요' }; }
}

/* 이미지 Storage — 브라우저 WebP 변환(원본1280·썸네일600) */
async function fileToBitmap(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
  }
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
function bitmapToWebp(bmp, targetWidth, quality) {
  const srcW = bmp.width || bmp.naturalWidth, srcH = bmp.height || bmp.naturalHeight;
  const w = Math.min(targetWidth, srcW);
  const h = Math.round(srcH * w / srcW);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('WebP 변환에 실패했어요 (브라우저 미지원)')), 'image/webp', quality));
}
async function uploadToPosts(blob, path) {
  const { error } = await sb.storage.from(POST_BUCKET).upload(path, blob, { contentType: 'image/webp', upsert: false });
  if (error) throw error;
  return sb.storage.from(POST_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function uploadPostImage(file, category, seoName) {
  const slug = CATEGORY_SLUG[category] || 'etc';
  const ts = Date.now();
  const seo = seoName ? sanitizeSeoSlug(seoName) : '';
  const filename = seo ? seo + '-' + ts + '.webp' : ts + '.webp';
  const bmp = await fileToBitmap(file);
  const originalWebp = await bitmapToWebp(bmp, 1280, 0.8);
  const thumbWebp = await bitmapToWebp(bmp, 600, 0.75);
  const originalUrl = await uploadToPosts(originalWebp, slug + '/' + filename);
  const thumbUrl = await uploadToPosts(thumbWebp, slug + '/thumb/' + filename);
  return { thumbUrl, originalUrl };
}
function postImagePathFromUrl(url) { const m = '/' + POST_BUCKET + '/'; const i = url.indexOf(m); return i < 0 ? null : url.slice(i + m.length); }
async function isPostImageInUse(originalUrl, origPath) {
  const filename = origPath.slice(origPath.lastIndexOf('/') + 1);
  try {
    const byImages = await sb.from('posts').select('id', { count: 'exact', head: true }).contains('images', [{ url: originalUrl }]);
    if (byImages.error) return true;
    if ((byImages.count || 0) > 0) return true;
    const byThumb = await sb.from('posts').select('id', { count: 'exact', head: true }).ilike('thumbnail_url', '%' + filename);
    if (byThumb.error) return true;
    return (byThumb.count || 0) > 0;
  } catch { return true; }
}
async function deletePostImages(urls) {
  const paths = [];
  for (const url of urls) {
    const p = postImagePathFromUrl(url);
    if (!p) continue;
    if (await isPostImageInUse(url, p)) continue;
    paths.push(p);
    const t = p.replace(/\/([^/]+)$/, '/thumb/$1');
    if (t !== p) paths.push(t);
  }
  if (!paths.length) return;
  const { error } = await sb.storage.from(POST_BUCKET).remove(paths);
  if (error) throw error;
}

/* Edge Functions */
function fnErrorMessage(error, fallback) {
  if (!error) return fallback;
  const ctx = error.context;
  if (ctx && ctx.status === 403) return 'staff 전용 기능이에요 (403)';
  if (ctx && ctx.status === 401) return '로그인이 만료됐어요. 다시 로그인해주세요 (401)';
  return error.message || fallback;
}

}
function monthRange(year, month) {
  const p = n => String(n).padStart(2, '0');
  const last = new Date(year, month, 0).getDate();
  return { start: year + p(month) + '01', end: year + p(month) + p(last) };
}
function normalizeFestivalName(t) { return t.replace(/20\d{2}/g, '').replace(/제?\s*\d+\s*회/g, '').replace(/\s+/g, '').toLowerCase(); }
function mergeFestivalYears(cur, prev) {
  const ids = new Set(cur.map(i => i.contentId)), names = new Set(cur.map(i => normalizeFestivalName(i.title)));
  return [...cur, ...prev.filter(i => !ids.has(i.contentId) && !names.has(normalizeFestivalName(i.title)))];
}
function fmtMMDD(s) { return s && s.length === 8 ? s.slice(4, 6) + '/' + s.slice(6, 8) : (s || ''); }

  function joinHi(arr) { const out = []; arr.forEach((t, i) => { if (i) out.push(', '); out.push(...hiText(t.replace(/\n/g, ' '), S.q)); }); return out; }
  function renderFound() {

const NOTICE_BUCKET = 'announcements';

async function fetchAllNotices() {
  const { data, error } = await sb.from('announcements').select('*').order('created_at', { ascending: false });
  if (error) throw error;
  return data || [];
}
async function createNotice(input, publish) {
  const { data, error } = await sb.from('announcements').insert({
    title: input.title, content: input.content, image_url: input.image_url ?? null, is_critical: input.is_critical ?? false,
    published_at: publish ? new Date().toISOString() : null,
  }).select().single();
  if (error) throw error;
  return data;
}
async function updateNotice(id, input) {
  const { error } = await sb.from('announcements').update({
    title: input.title, content: input.content, image_url: input.image_url ?? null, is_critical: input.is_critical ?? false,
  }).eq('id', id);
  if (error) throw error;
}
async function setNoticePublished(id, publish) {
  const { error } = await sb.from('announcements').update({ published_at: publish ? new Date().toISOString() : null }).eq('id', id);
  if (error) throw error;
}
async function deleteNotice(notice) {
  if (notice.image_url) {
    const filename = notice.image_url.split('/').pop();
    if (filename) await sb.storage.from(NOTICE_BUCKET).remove([filename]);
  }
  const { error } = await sb.from('announcements').delete().eq('id', notice.id);
  if (error) throw error;
}
// 앱 = 갤러리 JPEG 품질 0.85·크기 조절 없음. PC 원본은 버킷 상한 5MB를 넘을 수 있어 가로 1600 이하 JPEG 0.85로 변환 (유일한 차이)
async function uploadNoticeImage(file) {
  const bmp = await fileToBitmap(file);
  const srcW = bmp.width || bmp.naturalWidth, srcH = bmp.height || bmp.naturalHeight;
  const w = Math.min(1600, srcW), h = Math.round(srcH * w / srcW);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('이미지 변환에 실패했어요')), 'image/jpeg', 0.85));
  const filename = Date.now() + '.jpg';
  const { error } = await sb.storage.from(NOTICE_BUCKET).upload(filename, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  return sb.storage.from(NOTICE_BUCKET).getPublicUrl(filename).data.publicUrl;
}

/* 본문 마크업 툴바 — 포스트 폼과 같은 마커 (## · ** · __ · =y= =b= =r= =g=) */
function markupToolbar(ta, onChange) {
  const wrapSel = (mark, msg) => {
    const s = ta.selectionStart, e = ta.selectionEnd;
    if (s === e) return toast(msg, true);
    const v = ta.value; ta.value = v.slice(0, s) + mark + v.slice(s, e) + mark + v.slice(e);
    ta.setSelectionRange(s, e + mark.length * 2); ta.focus(); onChange(ta.value);
  };
  const applyH2 = () => {
    const v = ta.value, s = ta.selectionStart, ls = v.lastIndexOf('\n', s - 1) + 1;
    ta.value = v.startsWith('## ', ls) ? v.slice(0, ls) + v.slice(ls + 3) : v.slice(0, ls) + '## ' + v.slice(ls);
    ta.focus(); onChange(ta.value);
  };
  const hl = (color, mark) => el('button', { class: 'mdBtn hl', title: '형광펜', onClick: () => wrapSel(mark, '형광펜을 칠할 텍스트를 먼저 선택하세요') }, el('i', { style: { background: color } }));
  ta.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'b') { e.preventDefault(); wrapSel('**', '굵게 할 텍스트를 먼저 선택하세요'); }
    if (e.key === 'u') { e.preventDefault(); wrapSel('__', '밑줄 칠 텍스트를 먼저 선택하세요'); }
  });
  return el('div', { class: 'mdToolbar' },
    el('button', { class: 'mdBtn', onClick: applyH2 }, 'H2 소제목'),
    el('button', { class: 'mdBtn', style: { fontWeight: 700 }, onClick: () => wrapSel('**', '굵게 할 텍스트를 먼저 선택하세요') }, 'B'),
    el('button', { class: 'mdBtn', style: { textDecoration: 'underline' }, onClick: () => wrapSel('__', '밑줄 칠 텍스트를 먼저 선택하세요') }, 'U'),
    hl('#FED23E', '=y='), hl('#60A4CE', '=b='), hl('#FF9A89', '=r='), hl('#8DC970', '=g='),
    el('span', { class: 'caption', style: { alignSelf: 'center' } }, 'Ctrl+B 굵게 · Ctrl+U 밑줄'));
}
/* 본문 마크업 렌더 (app/post/[id].tsx renderInline·ContentBlock와 동일 규칙) — 공지·포스트 미리보기 공용 */
function renderMarkupInline(line) {
  const re = /\*\*(.+?)\*\*|__(.+?)__|=([ybrg])=(.+?)=\3=|==(.+?)==/g;
  const nodes = []; let last = 0, mt;
  while ((mt = re.exec(line)) !== null) {
    if (mt.index > last) nodes.push(line.slice(last, mt.index));
    if (mt[1] !== undefined) nodes.push(el('b', {}, mt[1]));
    else if (mt[2] !== undefined) nodes.push(el('u', {}, mt[2]));
    else if (mt[4] !== undefined) nodes.push(el('mark', { class: mt[3] }, mt[4]));
    else nodes.push(el('mark', { class: 'b' }, mt[5]));
    last = mt.index + mt[0].length;
  }
  if (last < line.length) nodes.push(line.slice(last));
  return nodes;
}
function renderMarkupBlock(text, cls) {
  const lines = (text || '').replace(/\r/g, '').split('\n');
  const box = el('div', { class: cls });
  lines.forEach((line, idx) => {
    if (line.startsWith('## ')) return box.append(el('h2', {}, ...renderMarkupInline(line.slice(3))));
    if (line.trim() === '') { if (idx > 0 && lines[idx - 1].startsWith('## ')) return; return box.append(el('div', { class: 'gap' })); }
    box.append(el('p', {}, ...renderMarkupInline(line)));
  });
  return box;
}

  function beforeUnload(e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } }
  window.addEventListener('beforeunload', beforeUnload);
  function detach() { window.removeEventListener('beforeunload', beforeUnload); }
  const schedulePreview = debounce(renderPreview, 250);
  const markDirty = () => { S.dirty = true; syncBtns(); schedulePreview(); };

  const titleIn = el('input', { class: 'input', placeholder: '공지 제목', value: S.title });
  titleIn.addEventListener('input', () => { S.title = titleIn.value; markDirty(); });
  const bodyIn = el('textarea', { class: 'input body', placeholder: '공지 내용을 입력하세요 (## 소제목 · **굵게** · __밑줄__ · =y=형광펜=y=)' }); bodyIn.value = S.content;
  bodyIn.addEventListener('input', () => { S.content = bodyIn.value; markDirty(); });
  const toolbar = markupToolbar(bodyIn, v => { S.content = v; markDirty(); });

  const imgBox = el('div', { class: 'field' });
  const fileIn = el('input', { type: 'file', accept: 'image/*', class: 'hidden', onChange: () => { const f = fileIn.files[0]; fileIn.value = ''; if (!f) return; if (S.pendingPreview) URL.revokeObjectURL(S.pendingPreview); S.pendingFile = f; S.pendingPreview = URL.createObjectURL(f); buildImage(); markDirty(); } });
  function buildImage() {
    clear(imgBox);
    const src = S.pendingPreview || S.imageUrl;
    if (src) imgBox.append(el('img', { class: 'imgPrev', src, alt: '' }),
      el('div', { class: 'row' },
        el('button', { class: 'btn sm', onClick: () => fileIn.click() }, '다른 사진'),
        el('button', { class: 'btn sm danger', onClick: () => { if (S.pendingPreview) URL.revokeObjectURL(S.pendingPreview); S.pendingFile = null; S.pendingPreview = null; S.imageUrl = null; buildImage(); markDirty(); } }, '이미지 제거'),
        S.pendingFile ? el('span', { class: 'caption' }, '저장할 때 업로드돼요 (JPEG · 가로 1600 이하)') : null));
    else imgBox.append(el('button', { class: 'btn', style: { width: '100%' }, onClick: () => fileIn.click() }, '🖼 이미지 선택 (선택 · 1장)'));
    imgBox.append(fileIn);
  }
  buildImage();

  form.append(
    el('div', { class: 'field' }, el('span', { class: 'label' }, '제목 *'), titleIn),
    el('div', { class: 'field' }, el('span', { class: 'label' }, '내용 *'), toolbar, bodyIn),
    el('div', { class: 'field' }, el('span', { class: 'label' }, '이미지 (선택)'), el('span', { class: 'helper' }, '앱에선 제목 아래 16:9로 가로 꽉 차게 보여요'), imgBox),
    el('div', { class: 'caption' }, isEdit ? '작성 ' + fmtNoticeDate(notice.created_at) + (notice.published_at ? ' · 발행 ' + fmtNoticeDate(notice.published_at) : ' · 초안') : '초안 저장 = 사용자에게 안 보임 · 발행 = 공지 화면에 바로 노출'),
    el('div', { style: { height: '40px' } }));
  syncBtns();
  renderPreview();

  function renderPreview() {
    if (!screen.isConnected) return;
    const nv = el('div', { class: 'nv' });
    nv.append(el('div', { class: 'hdr' }, '‹ 공지사항'));
    if (!S.title.trim() && !S.content.trim()) { nv.append(el('div', { class: 'empty' }, '제목과 내용을 입력하면 여기에 보여요')); clear(screen).append(nv); return; }
    const src = S.pendingPreview || S.imageUrl;
    const card = el('div', { class: 'card' + (notice?.is_critical ? ' crit' : '') },
      el('div', { class: 'top' }, el('div', { style: { flex: 1 } }, el('div', { class: 'ttl' }, S.title || '제목'), el('div', { class: 'dt' }, fmtNoticeDate(notice?.published_at || notice?.created_at || new Date().toISOString()) + (isPublished ? '' : ' · 초안'))), el('span', { class: 'chev' }, '⌃')),
      src ? el('img', { class: 'img', src, alt: '' }) : el('div', { class: 'line' }),
      renderMarkupBlock(S.content, 'body'));
    nv.append(card);
    clear(screen).append(nv);
  }

  async function handleSave(pubMode) {
    if (!canSave()) return toast('제목과 내용을 입력해주세요', true);
    S.saving = true; syncBtns();
    try {
      let imageUrl = S.imageUrl;
      if (S.pendingFile) imageUrl = await withTimeout(uploadNoticeImage(S.pendingFile), 30000, '이미지 업로드');
      const input = { title: S.title.trim(), content: S.content.trim(), image_url: imageUrl };
      if (isEdit) {
        await withTimeout(updateNotice(notice.id, input), DB_TIMEOUT_MS, '저장');
        if (pubMode === 'publish' && !notice.published_at) await withTimeout(setNoticePublished(notice.id, true), DB_TIMEOUT_MS, '발행');
      } else {
        await withTimeout(createNotice(input, pubMode === 'publish'), DB_TIMEOUT_MS, '저장');
      }
      S.dirty = false; detach();
      toast(pubMode === 'publish' ? '공지가 발행되었어요' : pubMode === 'draft' ? '초안으로 저장했어요 (사용자에겐 안 보여요)' : '저장되었어요');
      showNotices();
    } catch (e) { await alertDialog((e?.message || '저장에 실패했어요') + '\n\n입력한 내용은 그대로 남아 있어요.', '저장 실패'); }
    finally { S.saving = false; syncBtns(); }
  }
  async function handleUnpublish() {
    if (!(await confirmDialog('이 공지를 초안으로 되돌릴까요?\n사용자 화면에서 바로 사라집니다.', { title: '발행 취소', confirmLabel: '발행 취소', danger: true }))) return;
    try { await withTimeout(setNoticePublished(notice.id, false), DB_TIMEOUT_MS, '발행 취소'); S.dirty = false; detach(); toast('초안으로 되돌렸어요'); showNotices(); }
    catch (e) { toast(e?.message || '실패했어요', true); }
  }
}

/* ═══════════════════════════════════════════════════════════════
   9. 시작
   ═══════════════════════════════════════════════════════════════ */
boot();
</script>
</body>
</html>
